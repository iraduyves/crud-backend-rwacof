version: "3.8"

services:
  mysql_db:
    container_name: mysql_container
    image: mysql:8
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rwacof_analytics
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      BASE_URL:http: //127.0.0.1:5000/api   

    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  app:
    build: .
    container_name: crud-backend-rwacof
    ports:
      - "5000:5000"
    environment:
      APP_NAME: CRUD-BACKEND-RWACOF
      PORT: 5000
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: crud_rwacof__product_db
    depends_on:
      - mysql_db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
